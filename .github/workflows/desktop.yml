# Building the floating note for the three desktops.
#
# Two jobs, and the split matters. `check` is cheap and runs on every push:
# the tests, the linter, the typechecker, on Linux only, because none of them
# have a platform-specific answer. `bundle` is slow — a release build of a
# webview app is minutes per platform — so it runs on the branches that
# produce something somebody installs, and on tags.
#
# Path-filtered, because the web app shares this repository and rebuilding
# three operating systems for a change to a marketing page would be absurd.
#
# Code signing is off. See the notes further down: the inputs are wired, so
# turning it on is adding two secrets rather than rewriting this file.

name: Desktop app

on:
  push:
    branches: ["**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  # How a release is cut, and how a bundle is asked for out of turn.
  #
  # Tags are deliberately not a push trigger. A `paths` filter applies to tag
  # pushes as well as branch ones, so tagging a commit that happened not to
  # touch `desktop/` would silently build nothing — a release that quietly
  # does not happen is worse than one that takes an extra click. Instead:
  # push the tag, then run this from the Actions tab with that tag selected.
  # `github.ref` is the tag, and the release job below picks it up.
  #
  # A tag is not required, though. Some environments cannot push one — a
  # proxy that only allows the working branch, for instance — and "there is
  # no way to cut a release from here" is a bad place to end up. Tick
  # `publish_release` and the same four bundles are attached to a release
  # named from the app's own version.
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the bundles to a release (published, not draft)"
        type: boolean
        default: false

# A second push to the same branch makes the first one pointless. Tags are
# excluded: a cancelled release build leaves a half-published release.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  check:
    name: Tests and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The webview and its dependencies. Ubuntu 22.04 ships webkit2gtk-4.0
      # and Tauri v2 wants 4.1, which is why the version is pinned rather
      # than left as `ubuntu-latest` — a runner image bump has broken this
      # for a lot of people.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci

      # Typecheck and build the window's own code. `npm run build` is
      # `tsc --noEmit && vite build`, so this covers both.
      - name: Frontend
        run: npm run build

      # The window's TypeScript, by its own rules. This did not exist until
      # the web app's deploy failed and turned out to be typechecking this
      # directory — finding two real React mistakes in here on its way to
      # failing for an unrelated reason. Nothing was watching this code.
      - name: Lint the window
        run: npm run lint

      # Two modules whose names differ only in case compile fine on this
      # runner and break every case-insensitive one. Cheap to check here;
      # otherwise it is found by three simultaneously failing release builds.
      - name: Filenames that only work on Linux
        working-directory: .
        run: node scripts/no-case-collisions.mjs

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    name: ${{ matrix.name }}
    needs: check
    # Slow, so only where it earns its place: the default branch, the branch
    # this is developed on, a release tag, or when somebody asks.
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/claude/assignments-web-app-udolko'
    strategy:
      # One platform failing must not hide whether the other two are fine.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-14
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      # Whether there is anything to sign with. Evaluated here because a step
      # `if:` cannot reach the secrets context directly.
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: System libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # ── Signing ──────────────────────────────────────────────────────
      #
      # Off, and this is how it stays off *safely*.
      #
      # The first version of this file passed `APPLE_CERTIFICATE:
      # ${{ secrets.APPLE_CERTIFICATE }}` straight to the build. With no such
      # secret that resolves to an empty string — and an empty variable is not
      # an absent one. Tauri saw it, tried to import a certificate made of
      # nothing, and both macOS bundles died at the codesign step while Linux
      # and Windows sailed past. "Wired but inert" has to mean genuinely
      # unset.
      #
      # So the values are only put into the environment when they exist. The
      # day the secrets are added, signing starts happening and nothing here
      # changes. Notarising additionally needs the hardened runtime, which
      # needs an entitlements file — `bundle.macOS.entitlements` is the slot,
      # and a test asserts it is still there.
      #
      # Windows is simpler and needs nothing here: signing is driven by
      # `bundle.windows.certificateThumbprint` in tauri.conf.json, which is
      # present and null, next to a timestamp URL that is already set — a
      # signed build with no timestamp stops validating the day the
      # certificate expires. Fill the thumbprint in and install the
      # certificate on the runner and it signs.
      - name: Signing certificate, if there is one
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Heredoc form, because a base64 certificate is long and the
          # single-line form would break on any newline inside it.
          {
            echo "APPLE_CERTIFICATE<<TOUGATHER_EOF"
            echo "$CERTIFICATE"
            echo "TOUGATHER_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_ID=$ID"
            echo "APPLE_PASSWORD=$APP_PASSWORD"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run tauri -- build --target ${{ matrix.target }}
        env:
          # Which deployment this build talks to. Read at compile time by
          # `auth::site()`, so a staging build is an input rather than a code
          # change. Unset falls back to https://tougather.com.
          TOUGATHER_SITE: ${{ vars.TOUGATHER_SITE }}

      # Everything installable, under a name that says which platform it is —
      # four artifacts called "bundle" would be four things nobody can tell
      # apart.
      - name: Collect
        uses: actions/upload-artifact@v4
        with:
          name: tougather-note-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  # A tag, or somebody asking for it. Never a plain push: a release that
  # happens because code was merged is a release nobody decided to make.
  release:
    name: Release
    needs: bundle
    if: >
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      inputs.publish_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Needed for the version step below: this job builds nothing, so
      # without it there is no `tauri.conf.json` to read the version out of.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The version the app calls itself, so the release and the thing inside
      # it cannot disagree. Read from the config rather than typed here.
      - name: Version
        id: version
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Draft when it came from a tag push, so nobody publishes by
          # tagging. Published when somebody ticked the box, because that is
          # what the box says.
          draft: ${{ !inputs.publish_release }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          name: Tougather note ${{ steps.version.outputs.name }}
          files: artifacts/**/*
          body: |
            The floating desktop note — a small window that stays above every
            other app, opens with ⌘⇧N (Ctrl+Shift+N elsewhere), and keeps what
            you write in your Tougather account.

            **These builds are not code-signed.** macOS will say the app is
            damaged until you right-click it and choose *Open*; Windows
            SmartScreen will warn once. Both are the message every unsigned
            app gets, and signing is wired into the build waiting on
            certificates.

            | You have | Download |
            | --- | --- |
            | A Mac with Apple silicon | the `aarch64` `.dmg` |
            | An Intel Mac | the `x64` `.dmg` |
            | Windows | the `.exe` or `.msi` |
            | Linux | the `.AppImage`, `.deb` or `.rpm` |
