<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Glass browser – Arc-achtige layout in de "GCT Balance"-stijl
   .window > .mesh (blobs)  |  .sidebar (glas)  |  .main > .pane (pagina)
   ========================================================= */
:root{
  --font:"Outfit",-apple-system,"SF Pro Display","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --sb-w:272px;
  --ink:#221f2a;
  --ink-2:rgba(34,31,42,.58);
  --accent:#b48cf0;
}
@property --c{syntax:'<color>';inherits:false;initial-value:#c4b2ec}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);overflow:hidden;
  background:radial-gradient(120% 90% at 50% 15%,#f0f0f0 0%,#e2e2e4 55%,#d3d3d6 100%);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid rgba(255,255,255,.95);outline-offset:1px}
.pane [tabindex]:focus-visible,.pane button:focus-visible{outline-color:var(--ink)}
svg{display:block}

/* ---------- venster ---------- */
.window{
  position:fixed;inset:clamp(8px,2vw,26px);display:flex;
  border-radius:26px;overflow:hidden;background:#efe9f3;
  box-shadow:0 50px 90px -40px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.05);
  transition:inset .35s cubic-bezier(.2,.8,.2,1),border-radius .35s;
}
.window.max{inset:0;border-radius:0}

/* ---------- mesh ---------- */
.mesh{position:absolute;inset:0;z-index:0;overflow:hidden}
.blob{
  position:absolute;border-radius:50%;filter:blur(60px);will-change:transform;
  background:radial-gradient(circle,var(--c) 0%,var(--c) 28%,transparent 70%);
  transition:--c 1.2s ease;
  animation:drift var(--d,26s) ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(var(--tx,30px),var(--ty,-24px),0) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}.page{animation:none}}

/* ---------- zijbalk ---------- */
.sidebar{
  position:relative;z-index:3;width:var(--sb-w);flex:0 0 auto;
  display:flex;flex-direction:column;padding:12px 12px 12px;color:#fff;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1);
}
.sidebar::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(30,26,40,.28) 0%,rgba(30,26,40,.12) 30%,rgba(30,26,40,.10) 100%);
}
.window.collapsed .sidebar{position:absolute;left:0;top:0;bottom:0;transform:translateX(calc(-100% - 12px));z-index:6}
.window.collapsed .sidebar.peek{transform:none;-webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2);box-shadow:20px 0 60px -30px rgba(0,0,0,.35)}
.window.collapsed .sidebar.peek::before{background:linear-gradient(180deg,rgba(30,26,40,.34),rgba(30,26,40,.22))}
.edge{position:absolute;left:0;top:0;bottom:0;width:14px;z-index:5;display:none}
.window.collapsed .edge{display:block}

.tl{display:flex;align-items:center;gap:8px;padding:6px 6px 10px 8px}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--tlc);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18);cursor:pointer}
.tl .grow{flex:1}
.grow{flex:1}

.ib{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  color:rgba(255,255,255,.92);transition:background .18s,transform .12s;
}
.ib:hover{background:rgba(255,255,255,.22)}
.ib:active{transform:scale(.94)}
.ib[disabled]{opacity:.35;cursor:default}
.ib[disabled]:hover{background:none}
.ib svg{width:16px;height:16px}
.navrow{display:flex;align-items:center;gap:2px;padding:0 0 8px}

.url{
  display:flex;align-items:center;gap:9px;width:100%;height:36px;padding:0 10px 0 12px;
  border-radius:12px;font-size:13px;color:#fff;text-align:left;cursor:text;
  background:rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.14);
  transition:background .18s;
}
.url:hover{background:rgba(255,255,255,.3)}
.url svg{width:14px;height:14px;opacity:.85;flex:none}
.url .dom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url .dom.empty{opacity:.7}

.scroll{flex:1;min-height:0;overflow:auto;margin:0 -4px;padding:0 4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

.favs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 0 4px}
.fav{
  height:52px;border-radius:15px;display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.12);
  transition:background .18s,transform .12s,color .18s;
}
.fav:hover{background:rgba(255,255,255,.32)}
.fav:active{transform:scale(.96)}
.fav.active{background:rgba(255,255,255,.66);color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 2px 10px rgba(0,0,0,.06)}
.fav svg{width:20px;height:20px}

.list{display:flex;flex-direction:column;gap:2px}
.tab{
  position:relative;display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 6px 0 8px;
  border-radius:11px;font-size:13px;color:rgba(255,255,255,.95);text-align:left;cursor:pointer;
  transition:background .18s,color .18s;
}
.tab:hover{background:rgba(255,255,255,.24)}
.tab.active{background:rgba(255,255,255,.66);color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 1px 8px rgba(0,0,0,.05)}
.fi{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;flex:none;font-size:10.5px;font-weight:500;color:#fff}
.fi svg{width:12px;height:12px}
.tab .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;opacity:0;transition:opacity .15s,background .15s;color:inherit}
.tab .x svg{width:11px;height:11px}
.tab:hover .x{opacity:.75}
.tab .x:hover{background:rgba(0,0,0,.1);opacity:1}
.tab.newtab{color:rgba(255,255,255,.82)}
.tab.newtab .fi{background:rgba(255,255,255,.18)}
.tab.newtab:hover{color:#fff}

.sec{display:flex;align-items:center;gap:8px;padding:14px 8px 6px;font-size:11.5px;color:rgba(255,255,255,.75)}
.sec .line{flex:1;height:1px;background:rgba(255,255,255,.35)}
.sec button{font-size:11.5px;color:rgba(255,255,255,.75);border-radius:6px;padding:2px 6px}
.sec button:hover{color:#fff;background:rgba(255,255,255,.18)}

.bottom{display:flex;align-items:center;gap:6px;padding:12px 0 0;position:relative}
.spaces{flex:1;display:flex;justify-content:center;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);min-width:0;overflow:hidden}
.sp{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:9px;font-size:12px;color:rgba(255,255,255,.85);transition:background .2s,color .2s;white-space:nowrap}
.sp svg{width:15px;height:15px;flex:none}
.sp:hover{background:rgba(255,255,255,.2)}
.sp.active{background:rgba(255,255,255,.66);color:var(--ink)}
.sp:not(.active) .n{display:none}

.pop{
  position:absolute;left:0;bottom:44px;width:236px;padding:8px;border-radius:16px;color:var(--ink);
  background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  box-shadow:0 20px 50px -20px rgba(20,10,40,.4),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6);
  display:none;animation:popin .2s cubic-bezier(.2,.8,.2,1);
}
.pop.open{display:block}
@keyframes popin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop h4{font-size:11.5px;font-weight:400;color:var(--ink-2);padding:6px 10px 4px}
.pop .row{height:36px;font-size:13px;border-radius:10px}
.pop .empty{padding:6px 10px 8px;font-size:12.5px;color:var(--ink-2)}

/* ---------- content ---------- */
.main{position:relative;z-index:1;flex:1;min-width:0;padding:10px 10px 10px 0}
.window.collapsed .main{padding-left:46px}
.showsb{position:absolute;left:8px;top:18px;z-index:4;display:none;background:rgba(255,255,255,.55);color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 4px 14px -6px rgba(0,0,0,.2)}
.showsb:hover{background:rgba(255,255,255,.8)}
.window.collapsed .showsb{display:grid}
.pane{
  position:relative;height:100%;border-radius:18px;overflow:auto;
  background:rgba(255,255,255,.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.55),0 10px 40px -24px rgba(0,0,0,.3);
  scrollbar-width:thin;scrollbar-color:rgba(34,31,42,.18) transparent;
}
.pane::-webkit-scrollbar{width:8px}
.pane::-webkit-scrollbar-thumb{background:rgba(34,31,42,.18);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.progress{position:sticky;top:0;height:2px;z-index:3;margin-bottom:-2px;pointer-events:none}
.progress i{display:block;height:100%;width:0;background:var(--accent);opacity:0;border-radius:2px}
.progress.go i{animation:load .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes load{0%{width:0;opacity:1}70%{width:85%;opacity:1}100%{width:100%;opacity:0}}
.page{min-height:100%;animation:pagein .32s cubic-bezier(.2,.8,.2,1)}
.page.fill{height:100%}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.toast{
  position:absolute;left:50%;bottom:22px;transform:translate(-50%,10px);opacity:0;z-index:5;
  padding:9px 16px;border-radius:12px;font-size:13px;color:#fff;background:rgba(34,31,42,.88);
  box-shadow:0 12px 30px -10px rgba(0,0,0,.4);transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- command bar ---------- */
.cmd{position:absolute;inset:0;z-index:20;display:none;align-items:flex-start;justify-content:center;padding-top:13vh;background:rgba(30,20,50,.16)}
.cmd.open{display:flex}
.cmdbox{
  width:min(600px,92%);border-radius:20px;overflow:hidden;
  background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(28px) saturate(1.3);backdrop-filter:blur(28px) saturate(1.3);
  box-shadow:0 30px 80px -20px rgba(20,10,40,.45),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6);
  animation:cmdin .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes cmdin{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.cmdtop{display:flex;align-items:center;gap:14px;padding:0 20px}
.cmdtop svg{width:20px;height:20px;color:var(--ink-2);flex:none}
.cmd input{flex:1;height:62px;border:0;background:transparent;font:300 20px/1 var(--font);color:var(--ink);outline:none;min-width:0}
.cmd input::placeholder{color:var(--ink-2)}
.cmd kbd{font:12px var(--font);padding:3px 7px;border-radius:7px;background:rgba(34,31,42,.07);color:var(--ink-2)}
.res{border-top:1px solid rgba(34,31,42,.08);padding:8px;max-height:340px;overflow:auto}
.row{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-size:14px;cursor:pointer;width:100%;text-align:left}
.row .fi{width:22px;height:22px;border-radius:7px;font-size:11.5px}
.row .fi svg{width:13px;height:13px}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .hint{font-size:12px;color:var(--ink-2);flex:none}
.row.sel,.row:hover{background:rgba(34,31,42,.07)}
.res h4{font-size:11.5px;font-weight:400;color:var(--ink-2);padding:8px 12px 4px}

/* =========================================================
   Pagina's in de pane
   ========================================================= */
.nt{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px}
.nt .time{font-size:92px;font-weight:200;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.nt .greet{font-size:16px;color:var(--ink-2)}
.nt .search{
  margin-top:28px;width:min(560px,100%);height:56px;border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 20px;
  background:rgba(255,255,255,.72);font-size:15px;color:var(--ink-2);text-align:left;
  box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.85),0 14px 30px -18px rgba(0,0,0,.25);transition:background .2s;
}
.nt .search:hover{background:rgba(255,255,255,.9)}
.nt .search svg{width:18px;height:18px;flex:none}
.nt .search kbd{margin-left:auto;font:12px var(--font);padding:3px 7px;border-radius:7px;background:rgba(34,31,42,.07)}
.nt .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px;max-width:640px}
.chip{height:32px;padding:0 12px 0 8px;border-radius:10px;background:rgba(255,255,255,.55);font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);transition:background .18s}
.chip:hover{background:rgba(255,255,255,.9)}
.chip .fi{width:16px;height:16px;border-radius:4px;font-size:9px}

.pg{padding:56px 64px 80px;max-width:820px;margin:0 auto}
.meta{display:flex;gap:18px;font-size:13px;color:var(--ink-2);margin-bottom:16px}
.pg h1{font-size:42px;font-weight:300;letter-spacing:-.6px;line-height:1.1;max-width:18ch}
.lede{font-size:18.5px;line-height:1.55;color:rgba(34,31,42,.85);margin:20px 0 26px;max-width:58ch}
.pg p{font-size:15.5px;line-height:1.66;margin:0 0 18px;max-width:64ch}
.hero{
  position:relative;height:250px;border-radius:24px;margin:6px 0 30px;overflow:hidden;color:#fff;
  background:radial-gradient(160px 120px at 10% 0%,rgba(222,230,140,.8),rgba(222,230,140,0) 70%),
             linear-gradient(172deg,#f5b3d9 0%,#f2a1c8 32%,#f5a67a 68%,#f6a24d 100%);
}
.hero .l{position:absolute;left:32px;top:26px;font-size:13px;max-width:60%;line-height:1.4}
.hero .n{position:absolute;left:30px;bottom:24px;font-size:72px;font-weight:200;line-height:1;letter-spacing:-1px}
.hero .n small{font-size:14px;margin-left:8px;font-weight:400;letter-spacing:.5px}
.hero .dots{position:absolute;right:0;bottom:0;width:60%;height:70%}
.pull{border-left:2px solid var(--accent);padding:4px 0 4px 20px;margin:6px 0 26px;font-size:23px;font-weight:300;line-height:1.35;max-width:30ch}

.dash{padding:44px 48px 56px}
.dash h1{font-size:34px;font-weight:300;letter-spacing:-.4px}
.dash .sub{font-size:13.5px;color:var(--ink-2);margin:4px 0 26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
.dc{position:relative;height:196px;border-radius:32px;padding:24px 26px;overflow:hidden}
.dc.g{background:rgba(255,255,255,.62);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.75),0 12px 30px -20px rgba(0,0,0,.2)}
.dc.dark{color:#fff;background:linear-gradient(180deg,#535e5a 0%,#2a3834 40%,#0b1a15 75%,#04100c 100%)}
.dc.warm{color:#fff;background:radial-gradient(90px 80px at 8% 0%,rgba(222,230,140,.85),rgba(222,230,140,0) 70%),linear-gradient(172deg,#f5b3d9 0%,#f2a1c8 32%,#f5a67a 68%,#f6a24d 100%)}
.dc .lbl{font-size:13px;opacity:.85}
.dc .big{font-size:52px;font-weight:300;line-height:1;margin-top:12px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.dc .big small{font-size:12px;margin-left:6px;letter-spacing:.5px}
.dc .gauge{position:absolute;left:0;bottom:0;width:100%;height:60px;overflow:visible}
.dc.wide{grid-column:1/-1;height:260px}
.dc .chart{position:absolute;left:0;bottom:0;width:100%;height:150px}
.dc .foot{position:absolute;right:26px;top:26px;font-size:12.5px;color:var(--ink-2);text-align:right}
.split{position:absolute;left:26px;right:26px;bottom:30px}
.split .bar{height:8px;border-radius:8px;overflow:hidden;display:flex;background:rgba(34,31,42,.08)}
.split .bar i{display:block;height:100%}
.split .bar .a{background:linear-gradient(90deg,#b48cf0,#c9b4f0)}
.split .bar .b{background:linear-gradient(90deg,#f4a6d0,#f6bfa0)}
.split .lb{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:8px}
.balance{display:flex;align-items:baseline;gap:14px;margin-top:12px}
.balance b{font-size:52px;font-weight:300;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.balance b small{font-size:12px;margin-left:4px}
.balance span{font-size:22px;font-weight:200;color:var(--ink-2)}

.mail{display:grid;grid-template-columns:330px 1fr;height:100%;min-height:0}
.ml{border-right:1px solid rgba(34,31,42,.08);padding:20px 10px;overflow:auto;min-height:0}
.ml h2{font-size:24px;font-weight:300;padding:8px 12px 14px}
.mi{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-radius:14px;cursor:pointer;align-items:start;width:100%;text-align:left;transition:background .15s}
.mi .mid{min-width:0;display:block}
.mi .s,.mi .sub,.mi .pv{display:block}
.mi:hover{background:rgba(34,31,42,.04)}
.mi.sel{background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 6px 16px -10px rgba(0,0,0,.2)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;color:#fff}
.mi .s{font-size:13.5px;font-weight:500;line-height:1.3}
.mi .sub{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .pv{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mi .tm{font-size:11.5px;color:var(--ink-2);padding-top:2px}
.mi .u{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;vertical-align:1px}
.mr{padding:44px 52px;max-width:700px;overflow:auto}
.mr h1{font-size:30px;font-weight:300;line-height:1.15;letter-spacing:-.4px}
.mr .from{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin:14px 0 28px}
.mr p{font-size:15px;line-height:1.66;margin-bottom:16px;max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;margin-top:8px}
.btn svg{width:15px;height:15px}
.btn:hover{background:#3a3546}

.cal{padding:40px 44px 34px;height:100%;display:flex;flex-direction:column;min-height:560px}
.cal h1{font-size:32px;font-weight:300;letter-spacing:-.4px}
.cal .sub{font-size:13px;color:var(--ink-2);margin:4px 0 0}
.wk{flex:1;display:grid;grid-template-columns:52px repeat(7,1fr);margin-top:22px;padding-bottom:16px;border-radius:24px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9);overflow:hidden;min-height:0}
.hours{display:flex;flex-direction:column}
.hours .hh{height:60px}
.hours .hb{flex:1;position:relative}
.hours .hb span{position:absolute;right:10px;transform:translateY(-50%);font-size:11px;color:var(--ink-2)}
.col{display:flex;flex-direction:column;border-left:1px solid rgba(34,31,42,.06);min-width:0}
.dh{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--ink-2)}
.dh b{font-size:19px;font-weight:300;color:var(--ink);width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.col.today .dh b{background:var(--ink);color:#fff;font-size:15px;font-weight:400}
.cbody{flex:1;position:relative;background:repeating-linear-gradient(180deg,transparent 0 calc(10% - 1px),rgba(34,31,42,.06) calc(10% - 1px) 10%)}
.ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:6px 9px;font-size:11.5px;line-height:1.3;overflow:hidden;color:var(--ink);cursor:default}
.ev b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{opacity:.7;font-size:10.5px}
.ev.g{background:rgba(56,214,110,.35)}.ev.l{background:rgba(180,140,240,.42)}.ev.o{background:rgba(248,160,80,.45)}
.ev.p{background:rgba(244,166,208,.55)}.ev.c{background:rgba(120,214,245,.5)}.ev.v{background:rgba(160,146,232,.5)}

.notes{display:grid;grid-template-columns:250px 1fr;height:100%;min-height:0}
.nl{border-right:1px solid rgba(34,31,42,.08);padding:20px 10px;overflow:auto}
.nl h2{font-size:24px;font-weight:300;padding:8px 12px 14px}
.ni{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background .15s}
.ni:hover{background:rgba(34,31,42,.04)}
.ni.sel{background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 6px 16px -10px rgba(0,0,0,.2)}
.ni .t,.ni .d{display:block;min-width:0}
.ni .t{font-size:13.5px;font-weight:500}
.ni .d{font-size:12px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ne{padding:46px 58px;max-width:760px;overflow:auto}
.ne .when{font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.ne h1{font-size:36px;font-weight:300;letter-spacing:-.5px;outline:none;line-height:1.15}
.ne .body{margin-top:16px;font-size:15.5px;line-height:1.7;outline:none;min-height:280px;white-space:pre-wrap;max-width:62ch}
.ne [contenteditable]:empty::before{content:attr(data-ph);color:var(--ink-2)}

.site .nav{display:flex;gap:22px;align-items:center;padding:24px 40px;font-size:13px;color:var(--ink-2)}
.site .nav b{color:var(--ink);font-weight:500;font-size:15px;margin-right:auto}
.site .hero2{margin:6px 40px 0;height:280px;border-radius:24px;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 36px;color:#fff;
  background:radial-gradient(160px 120px at 90% 0%,rgba(222,230,140,.8),rgba(222,230,140,0) 70%),linear-gradient(160deg,#c4b2ec 0%,#f4a6d0 50%,#f6a24d 100%)}
.site .hero2 h1{font-size:44px;font-weight:300;letter-spacing:-.6px;line-height:1.05}
.site .hero2 p{font-size:14px;opacity:.9;margin-top:8px}
.site .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:22px 40px 40px}
.site .c{height:150px;border-radius:22px;padding:20px 22px;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);display:flex;flex-direction:column;justify-content:flex-end}
.site .c b{font-size:15px;font-weight:500}
.site .c span{font-size:13px;color:var(--ink-2);margin-top:4px}
.site .results{padding:10px 40px 40px;max-width:760px}
.site .results h1{font-size:30px;font-weight:300;letter-spacing:-.4px;margin-bottom:22px}
.site .r{padding:14px 0;border-bottom:1px solid rgba(34,31,42,.08)}
.site .r b{display:block;font-size:16px;font-weight:400}
.site .r span{display:block;font-size:12.5px;color:var(--accent);margin:2px 0 4px}
.site .r p{font-size:13.5px;color:var(--ink-2);line-height:1.5}

@media (max-width:760px){
  .mail,.notes{grid-template-columns:1fr}
  .mr,.ne{display:none}
  .pg{padding:36px 28px 60px}
  .dash{padding:28px 22px}
  .grid{grid-template-columns:1fr}
  .site .cards{grid-template-columns:1fr}
}

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = (body, sw = 1.6) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;

/* ---------- iconen ---------- */
const I = {
  back: svg('<path d="M19 12H6M11 6l-6 6 6 6"/>'),
  fwd: svg('<path d="M5 12h13M13 6l6 6-6 6"/>'),
  reload: svg('<path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/>'),
  sidebar: svg('<rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M9.5 5v14"/>'),
  lock: svg('<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>', 1.8),
  share: svg('<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  close: svg('<path d="M6 6l12 12M18 6L6 18"/>', 2),
  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'),
  mail: svg('<rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M3.5 8l8.5 6 8.5-6"/>'),
  cal: svg('<rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  note: svg('<path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6M9.5 13h6M9.5 17h6"/>'),
  dash: svg('<path d="M3 13h4l2-5 3 9 3-7 2 3h4"/>'),
  home: svg('<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>'),
  pen: svg('<path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/>'),
  moon: svg('<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/>'),
  wave: svg('<path d="M3 12c3-5 6-5 9 0s6 5 9 0"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'),
  library: svg('<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>'),
  reply: svg('<path d="M9 10l-5 4 5 4M4 14h9a6 6 0 0 0 6-6V6"/>'),
  globe: svg('<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/>'),
  archive: svg('<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>'),
  download: svg('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  image: svg('<rect x="3" y="4" width="18" height="16" rx="3.5"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/>'),
};
const TYPE = {
  article:   { color: '#b48cf0', glyph: 'J' },
  dashboard: { color: '#5cc3a5', icon: 'dash' },
  notes:     { color: '#f6a24d', icon: 'note' },
  mail:      { color: '#f27bc9', icon: 'mail' },
  calendar:  { color: '#6cc1ee', icon: 'cal' },
  newtab:    { color: 'rgba(255,255,255,.22)', icon: 'search' },
  site:      { color: '#8b8fa8', icon: 'globe' },
};
const fi = (t, cls = 'fi') => {
  const d = TYPE[t.type] || TYPE.site;
  const inner = d.icon ? I[d.icon] : (t.glyph || d.glyph || esc(t.title[0] || '?'));
  return `<span class="${cls}" style="background:${d.color}">${inner}</span>`;
};

/* ---------- data ---------- */
let uid = 1;
const tab = (title, type, url, extra = {}) => ({ id: uid++, title, type, url, ...extra });

const PALETTES = {
  home:   ['150,160,90','178,190,88','192,184,160','196,178,236','244,166,208','196,178,236','238,200,228','248,160,80','120,214,245','242,120,204'],
  studio: ['90,140,110','178,190,88','206,222,80','120,214,245','56,214,110','190,230,150','150,225,220','248,228,70','120,214,245','178,190,88'],
  night:  ['70,60,130','110,90,200','160,146,232','242,120,204','110,140,250','150,120,230','200,150,240','242,120,204','90,180,250','160,146,232'],
  dune:   ['170,120,80','230,180,120','246,200,140','120,200,190','248,160,80','240,210,160','160,215,200','246,160,90','120,214,225','230,140,110'],
  sea:    ['60,110,150','90,170,220','150,220,240','120,214,245','60,150,200','170,230,230','200,235,245','80,190,230','120,214,245','140,180,240'],
};
const ACCENT = { home: '#b48cf0', studio: '#7cc46a', night: '#e07ad0', dune: '#f0a460', sea: '#5cb8e6' };

const SPACES = [
  { name: 'Home', icon: 'home', pal: 'home',
    favs: [tab('Mail', 'mail', 'mail.glass/inbox'), tab('Calendar', 'calendar', 'calendar.glass/week'), tab('Notes', 'notes', 'notes.glass'), tab('Stride Lab', 'dashboard', 'stridelab.app/dashboard')],
    pinned: [tab('The 20 milliseconds that decide a stride', 'article', 'stridelab.app/journal/contact-time'), tab('Weekly review', 'dashboard', 'stridelab.app/dashboard/week')],
    today: [tab('Design tokens', 'notes', 'notes.glass/design-tokens')] },
  { name: 'Studio', icon: 'pen', pal: 'studio',
    favs: [tab('Notes', 'notes', 'notes.glass'), tab('Calendar', 'calendar', 'calendar.glass/week')],
    pinned: [tab('Glass sidebar, second pass', 'notes', 'notes.glass/sidebar-pass-2')],
    today: [tab('Contact time journal', 'article', 'stridelab.app/journal/contact-time')] },
  { name: 'Night', icon: 'moon', pal: 'night',
    favs: [tab('Mail', 'mail', 'mail.glass/inbox')],
    pinned: [],
    today: [] },
];
for (const s of SPACES) { s.active = (s.pinned[0] || s.today[0] || s.favs[0]).id; s.hist = [s.active]; s.hpos = 0; }
const archived = [];
const state = { space: 0, collapsed: false };

const BLOB_POS = [[-8,-14,540],[22,-16,480],[54,-20,540],[84,-12,500],[-10,28,540],[34,24,580],[74,34,540],[-6,68,520],[40,74,540],[84,80,540]];

/* ---------- pagina-inhoud ---------- */
const MAIL = [
  { from: 'Stride Lab', ini: 'SL', col: '#5cc3a5', sub: 'Your weekly dynamics report is ready', pv: 'Contact time down 6 ms on average this week, balance steady at 51/49.', tm: '09:12', unread: true,
    body: ['Your average ground contact time this week came in at 270 ms, six milliseconds shorter than last week. Balance stayed at 51/49 across all five runs.', 'Cadence held between 168 and 174 steps per minute. The Thursday tempo run was your most even one yet, with balance drifting no further than 52/48 in the final kilometre.', 'Open the dashboard for the full breakdown per run.'] },
  { from: 'Noor van Dijk', ini: 'NV', col: '#b48cf0', sub: 'Route for Sunday?', pv: 'Thinking the forest loop again, 12 km, easy pace. Coffee after?', tm: '08:47', unread: true,
    body: ['Thinking the forest loop again this Sunday, 12 km at an easy pace. It has been dry all week, so the trail section should be fine.', 'Coffee after at the usual place? I can be there by 9.'] },
  { from: 'Team calendar', ini: 'TC', col: '#6cc1ee', sub: 'Design review moved to 15:00', pv: 'The Wednesday design review now starts an hour later.', tm: '08:30',
    body: ['The Wednesday design review now starts at 15:00 instead of 14:00. Same room, same agenda: sidebar spacing, the command bar, and the new space switcher.'] },
  { from: 'Jonas Lindqvist', ini: 'JL', col: '#f27bc9', sub: 'Sidebar spacing, second pass', pv: 'Tightened the tab rows to 34 px and gave the favourites a touch more air.', tm: 'Yesterday',
    body: ['Tightened the tab rows to 34 px and gave the favourites a touch more air. The active row now reads as a solid pill instead of a faint tint, which helps on the busier gradients.', 'I left the divider between pinned and today as a thin line. Labels felt like noise there.'] },
  { from: 'Bramble Coffee', ini: 'BC', col: '#f6a24d', sub: 'Your order is on its way', pv: 'Two bags of the Kenyan roast, arriving tomorrow.', tm: 'Yesterday',
    body: ['Two bags of the Kenyan roast are on their way and should arrive tomorrow before noon.', 'This batch is a little brighter than the last one. We would love to hear what you think.'] },
  { from: 'Mila Ferreira', ini: 'MF', col: '#5cb8e6', sub: 'Photos from the trail run', pv: 'Finally sorted them. The one at the ridge is my favourite.', tm: 'Mon',
    body: ['Finally sorted the photos from Saturday. The one at the ridge, just before the descent, is my favourite.', 'Sending the full set over the weekend.'] },
  { from: 'Studio newsletter', ini: 'SN', col: '#8b8fa8', sub: 'Three glass patterns we keep reusing', pv: 'Frosted panels, mesh gradients, and why we stopped using drop shadows.', tm: 'Mon',
    body: ['This month: frosted panels over mesh gradients, the thin light border that makes glass read as glass, and why we replaced most drop shadows with inset highlights.', 'Also a short note on legibility: white text needs a slightly darker gradient than you think.'] },
];
const NOTES = [
  { t: 'Design tokens', when: 'Edited today', body: 'Glass: white at 20% over the mesh, inset highlight at 45%.\nActive row: white at 66%, ink text.\nRadius: 11 px rows, 15 px tiles, 18 px pane, 26 px window.\nType: Outfit 300 for display, 400 for interface.\nMotion: only on actions. Pages fade up 6 px in 320 ms.' },
  { t: 'Run journal', when: 'Edited Tuesday', body: 'Tempo run felt controlled. Contact time 262 ms in the fast section, balance 51/49.\nCadence crept up on the hill; keep the steps long on the flat.' },
  { t: 'Glass sidebar, second pass', when: 'Edited Monday', body: 'Tab rows to 34 px. Favourites get more air.\nDivider stays a line, no label noise.\nTry the darker tint at the top of the sidebar for legibility.' },
  { t: 'Weekend', when: 'Edited Sunday', body: 'Forest loop with Noor, 12 km easy.\nCoffee. Photos from Mila.' },
];

const CAL_EVENTS = [
  [0, 9, 10, 'Easy run', 'g'], [0, 14, 15, 'Design sync', 'l'],
  [1, 8.5, 9.5, 'Intervals', 'o'], [1, 11, 12.5, 'Sidebar review', 'p'],
  [2, 10, 11, 'Long-run planning', 'c'], [2, 15, 16, 'Design review', 'l'],
  [3, 9, 10, 'Tempo run', 'g'], [3, 13, 14, 'Lunch with Noor', 'c'],
  [4, 9, 9.5, 'Standup', 'l'], [4, 16, 17, 'Journal draft', 'v'],

];

const fmtH = h => `${Math.floor(h)}:${h % 1 ? '30' : '00'}`;
const dayName = d => ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d];
const monthName = m => ['January','February','March','April','May','June','July','August','September','October','November','December'][m];

function dotsSVG() {
  // losse halftoon-dots als decoratie in de hero
  let out = '';
  for (let y = 0; y < 9; y++) for (let x = 0; x < 16; x++) {
    const d = Math.hypot(x - 11, (y - 5) * 1.15);
    if (d > 6.5) continue;
    const k = 1 - d / 6.5;
    out += `<circle cx="${x * 22 + 10}" cy="${y * 22 + 10}" r="${(1 + 3.2 * k).toFixed(2)}" fill="rgba(255,255,255,${(0.25 + 0.6 * k).toFixed(2)})"/>`;
  }
  return `<svg class="dots" viewBox="0 0 360 200" preserveAspectRatio="xMaxYMax meet">${out}</svg>`;
}

const PAGES = {
  newtab: () => {
    const recent = SPACES.flatMap(s => [...s.pinned, ...s.today]).filter(t => t.type !== 'newtab').slice(0, 5);
    return `<div class="nt">
      <div class="time" id="clock">--:--</div>
      <div class="greet" id="greet"></div>
      <button class="search" data-cmd>${I.search}<span>Search or enter a URL</span><kbd>⌘T</kbd></button>
      <div class="chips">${recent.map(t => `<button class="chip" data-open="${t.id}">${fi(t)}${esc(t.title)}</button>`).join('')}</div>
    </div>`;
  },
  article: () => `<div class="pg">
    <div class="meta"><span>Stride Lab journal</span><span>6 min read</span><span>Updated ${dayName(new Date().getDay())}</span></div>
    <h1>The 20 milliseconds that decide a stride</h1>
    <p class="lede">Ground contact time is the quietest number on a running watch. It is also the one that tells you most about how your body meets the road.</p>
    <div class="hero"><div class="l">Average contact time across the runners in our sample</div>${dotsSVG()}<div class="n">270<small>MS</small></div></div>
    <p>Every step has two halves: the moment your foot is planted and the moment it isn't. Most runners spend between 200 and 300 milliseconds on the ground per step. Elite runners hover closer to 180. The difference sounds tiny, but at 170 steps a minute it adds up to several seconds of extra flight per kilometre.</p>
    <p>Balance matters more than the raw number. A split of 51 to 49 between left and right is normal; most people carry a slight asymmetry that never causes trouble. What coaches look for is drift: a balance that moves toward 53/47 late in a run often shows up before the fatigue does.</p>
    <div class="pull">A 51/49 balance is not a fault to fix. It is a fingerprint.</div>
    <p>The useful habit is to watch contact time together with cadence. Shorter contact with a stable cadence usually means a springier stride. Shorter contact with a rising cadence often means you are simply taking smaller steps, which is fine on a climb and less so on a flat road.</p>
    <p>None of this needs a lab. A few weeks of runs, a watch that records dynamics, and a willingness to look at the boring numbers will tell you more than a single perfect session ever will.</p>
  </div>`,
  dashboard: () => {
    const d = new Date();
    return `<div class="dash">
      <h1>Morning run</h1>
      <div class="sub">${dayName(d.getDay())} ${d.getDate()} ${monthName(d.getMonth())}, 10.4 km in 52:18</div>
      <div class="grid">
        <div class="dc g"><div class="lbl">GCT balance</div>
          <div class="balance"><b><span id="balL">51</span><small>%</small></b><span>/</span><b><span id="balR">49</span><small>%</small></b></div>
          <div class="split"><div class="bar"><i class="a" id="barL" style="width:51%"></i><i class="b" style="flex:1"></i></div><div class="lb"><span>Left</span><span>Right</span></div></div>
        </div>
        <div class="dc dark"><div class="lbl">Contact time</div><div class="big"><span id="gct">270</span><small>MS</small></div>
          <svg class="gauge" viewBox="0 0 300 60" preserveAspectRatio="xMidYMax meet" id="ctg"><defs><filter id="blur" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="6"/></filter></defs></svg>
        </div>
        <div class="dc warm"><div class="lbl">Vertical oscillation</div><div class="big"><span id="vo">10.0</span><small>CM</small></div>
          <svg class="gauge" viewBox="0 0 300 60" preserveAspectRatio="xMidYMax meet" id="vog"></svg>
        </div>
        <div class="dc g wide"><div class="lbl">Cadence</div><div class="big"><span id="cad">171</span><small>SPM</small></div>
          <div class="foot">Synced from the watch<br>12 minutes ago</div>
          <svg class="chart" viewBox="0 0 600 150" preserveAspectRatio="none" id="chart"></svg>
        </div>
      </div>
    </div>`;
  },
  mail: t => {
    const sel = t.sel ?? 0;
    const m = MAIL[sel];
    return `<div class="mail">
      <div class="ml"><h2>Inbox</h2>${MAIL.map((x, i) => `<button class="mi${i === sel ? ' sel' : ''}" data-mail="${i}">
        <span class="av" style="background:${x.col}">${x.ini}</span>
        <span class="mid"><span class="s">${x.unread ? '<i class="u"></i>' : ''}${esc(x.from)}</span><span class="sub">${esc(x.sub)}</span><span class="pv">${esc(x.pv)}</span></span>
        <span class="tm">${x.tm}</span></button>`).join('')}</div>
      <div class="mr"><h1>${esc(m.sub)}</h1><div class="from"><span class="av" style="background:${m.col};width:26px;height:26px;font-size:10px">${m.ini}</span>${esc(m.from)} <span>${m.tm}</span></div>
        ${m.body.map(p => `<p>${esc(p)}</p>`).join('')}
        <button class="btn" data-toast="Reply started (this is a mock)">${I.reply}Reply</button></div>
    </div>`;

let ctG, voG;
function setupDashboard() {

  const dots = [];
  for (let i = 0; i <= 14; i++) { const q = qb(CT, i / 14); dots.push(mk(ctg, 'circle', { cx: q.x, cy: q.y, r: 1.8, fill: 'rgba(255,255,255,.3)' })); }
  const glow = mk(ctg, 'circle', { r: 12, fill: 'rgba(110,255,150,.7)', filter: 'url(#blur)' });
  const cur = mk(ctg, 'circle', { r: 3, fill: '#8dffb0' });
  ctG = f => { f = clamp(f, 0, 1); const q = qb(CT, f); for (const k of ['cx', 'cy']) { glow.setAttribute(k, q[k === 'cx' ? 'x' : 'y']); cur.setAttribute(k, q[k === 'cx' ? 'x' : 'y']); } dots.forEach((d, i) => d.setAttribute('fill', i / 14 <= f ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.28)')); };
  const VO = [{ x: 22, y: 52 }, { x: 150, y: 8 }, { x: 278, y: 52 }];
  mk(vog, 'path', { d: `M22 52 Q150 8 278 52`, fill: 'none', stroke: 'rgba(255,255,255,.85)', 'stroke-width': 1.3, 'vector-effect': 'non-scaling-stroke' });
  mk(vog, 'circle', { cx: 278, cy: 52, r: 2, fill: '#fff' });
  const mark = mk(vog, 'path', { d: 'M-5 -13 L5 -13 L0 -4 Z', fill: '#ffe14d' });
  voG = f => { const q = qb(VO, clamp(f, 0, 1)); mark.setAttribute('transform', `translate(${q.x.toFixed(2)} ${q.y.toFixed(2)})`); };
  // cadans-grafiek (60 samples)
  const chart = $('chart');
  const pts = [];
  for (let i = 0; i < 60; i++) { const x = i / 59 * 600; const v = 171 + 3.5 * Math.sin(i * .35) + 2 * Math.sin(i * 1.1 + 2) + (i > 44 ? 2.5 : 0) - (i < 6 ? 6 * (6 - i) / 6 : 0); pts.push([x, 150 - (v - 158) / 22 * 150]); }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const defs = mk(chart, 'defs', {});

  for (let k = 1; k < 4; k++) mk(chart, 'line', { x1: 0, x2: 600, y1: k * 37.5, y2: k * 37.5, stroke: 'rgba(34,31,42,.08)', 'vector-effect': 'non-scaling-stroke' });
}
let lastTick = -1;

document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && (e.key === 't' || e.key === 'T')) { e.preventDefault(); newTab(); }
  else if (mod && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); openCmd(activeTab().url, true); }
  else if (mod && (e.key === 's' || e.key === 'S')) { e.preventDefault(); setCollapsed(!state.collapsed); }
  else if (e.key === 'Escape') { closeCmd(); $('pop').classList.remove('open'); }
});

/* ---------- start ---------- */
applyTheme(); renderSidebar(); renderContent();
if (innerWidth < 760) setCollapsed(true);
})();
</script>
</body>
</html>
