<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>Balk</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="island.css" />
  </head>
  <body>
    <div id="kaart">
      <div id="rij">
        <canvas id="glyph" width="26" height="26" aria-hidden="true"></canvas>

        <div id="tekst">
          <div id="vorige"></div>
          <div id="huidig">Ctrl J</div>
        </div>

        <input id="invoer" type="text" spellcheck="false" autocomplete="off"
               data-t-plek="balk.opdracht" data-t-aria="balk.opdracht" hidden />

        <button id="ga" type="button" data-t="balk.door" hidden>Ga door</button>
        <button id="stop" type="button" data-t="balk.stop" hidden>Stop</button>
      </div>
    </div>

    <script src="taal.js"></script>
    <script src="glyph.js"></script>
    <script src="island.js"></script>
  </body>
</html>
