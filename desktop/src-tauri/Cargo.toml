[package]
name = "tougather-desktop"
version = "0.1.6"
description = "Tougather's floating note"
authors = ["Tougather"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri v2's layout: the binary is a shim over a library, so the same code can
# be driven from a desktop `main` or, later, a mobile entry point.
name = "tougather_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite into the binary. The alternative is linking
# whatever SQLite the machine happens to have, which on Windows is nothing and
# on Linux is a version roulette — for a store holding the only copy of
# somebody's notes, "which SQLite" is not a question worth leaving open.
rusqlite = { version = "0.32", features = ["bundled"] }
# The same alphabet and length the web app's `uid()` uses, so a note made on
# the desktop already has an id the server's column will accept. That is not a
# coincidence: a client minting ids the database rejects is exactly the bug
# that stopped every save from landing.
nanoid = "0.4"
# The webview never touches the network. Every call to Supabase is made here,
# which keeps the session out of JavaScript entirely and lets the window's
# content policy stay at `default-src 'self'` with no exceptions at all.
# rustls rather than the system OpenSSL: one less thing that has to be present
# on a user's machine, and one less thing that can be an old version of itself.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The OS keychain — Keychain on macOS, Credential Manager on Windows,
# Secret Service on Linux. A refresh token in a file is a refresh token
# anything running as you can read.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
# The async runtime Tauri already runs on, named here so the sync loop can use
# its timer and its channel rather than a thread and a mutex.
tokio = { version = "1", features = ["time", "sync"] }
getrandom = "0.3"
tauri-plugin-deep-link = "2"
# The microphone, in Rust rather than in the webview, and this is the decision
# the whole Record slot rests on.
#
# The system webview has `MediaRecorder` and `getUserMedia` — measured, see
# docs/desktop.md — so capturing *in* the window looked possible. Two things
# rule it out. The window's content policy is `connect-src 'self' ipc:` with
# no exceptions, so audio captured there could not be sent anywhere without
# widening the one policy `config_check.rs` exists to protect. And wry connects
# no `permission-request` handler on WebKitGTK at all, so what `getUserMedia`
# does there on a machine with a real microphone is unverified — with a
# credible report that the promise never settles, which is worse than a
# refusal because it is not catchable.
#
# cpal talks to ALSA, CoreAudio and WASAPI directly. It needs `libasound2-dev`
# on Linux at build time, which `.github/workflows/desktop.yml` now installs.
cpal = "0.15"
# The clipboard, read from Rust and only when a button is pressed.
#
# The plugin is registered on the Rust side and called through a named command,
# so `capabilities/default.json` stays four entries long — the JS API is what
# that file gates, and the window never gets it. That matters here more than
# anywhere else: a capture tool that can read the clipboard from JavaScript is
# a capture tool one webview bug away from reading your password manager's
# output.
tauri-plugin-clipboard-manager = "2"

# Desktop only, and only for one job: on Windows and Linux the browser's
# `tougather://` link starts a *second* copy of the app, which has to hand the
# link to the one already running rather than opening a second note window.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# The always-on-top behaviour macOS actually needs is not in the cross-platform
# API: joining every Space *and* staying up over a fullscreen app is a
# collection-behaviour flag, set through AppKit directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Only the one class this needs. The crate's default features pull in the
# whole of AppKit, which is minutes of compile time on every macOS CI run for
# a single setter call.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder"] }

[profile.release]
# A note window has no business being twenty megabytes.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
