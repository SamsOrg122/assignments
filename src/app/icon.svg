<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The nav's notched square, as a tab icon.

    Two departures from the drawn mark, both forced by 16 pixels: it is filled
    rather than stroked, because a 1.9px outline vanishes at that size and its
    hollow centre closes into a blob; and it sits on a solid tile, because a
    transparent mark takes the browser's tab colour and so disappears in
    exactly one of the two themes every user has.
  -->
  <rect width="64" height="64" rx="14" fill="#202124" />
  <path d="M21.5 12h21v9.5H52v21h-9.5V52h-21v-9.5H12v-21h9.5z" fill="#e8eaed" />
</svg>
